<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>淡水區災害應變智慧戰情中心</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        body { background-color: #121212; color: #ffffff; overflow: hidden; font-family: "Microsoft JhengHei", sans-serif; }
        .header { background-color: #1a1a1a; padding: 15px 20px; border-bottom: 2px solid #0dcaf0; }
        .dashboard-container { height: calc(100vh - 70px); padding: 15px; }
        
        /* 側邊氣象面板 */
        .monitor-panel { background-color: #1a1a1a; border-radius: 8px; padding: 10px; height: 31%; margin-bottom: 3%; position: relative; border: 1px solid #333; }
        .monitor-title { font-size: 1.1rem; font-weight: bold; margin-bottom: 8px; color: #0dcaf0; display: flex; align-items: center; }
        .monitor-title span { margin-right: 8px; }
        .cwa-image { width: 100%; height: calc(100% - 35px); object-fit: contain; background-color: #000; border-radius: 4px; }
        
        /* 中央地圖與資料面板 */
        .main-map-container { background-color: #1a1a1a; border-radius: 8px; height: 100%; position: relative; border: 1px solid #333; }
        #tamsui-map { width: 100%; height: 100%; border-radius: 8px; z-index: 1; }
        
        /* 防呆機制：文字通報列表 (顯示在右下角) */
        .data-list-panel { position: absolute; bottom: 20px; right: 20px; width: 350px; max-height: 40%; background-color: rgba(26, 26, 26, 0.9); border: 1px solid #0dcaf0; border-radius: 8px; padding: 15px; z-index: 1000; overflow-y: auto; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .data-list-panel h6 { color: #0dcaf0; border-bottom: 1px solid #444; padding-bottom: 8px; margin-bottom: 10px; }
        .report-item { background-color: #2a2a2a; padding: 10px; border-radius: 4px; margin-bottom: 8px; font-size: 0.9rem; border-left: 4px solid #dc3545; }
        
        /* 系統狀態標籤 */
        #sync-status { font-size: 0.9rem; padding: 5px 10px; border-radius: 4px; }
    </style>
</head>
<body>

<div class="header d-flex justify-content-between align-items-center">
    <h4 class="m-0 text-white">🌐 淡水區災害應變智慧戰情中心</h4>
    <div>
        <span id="sync-status" class="bg-secondary text-white me-3">系統初始化中...</span>
        <span id="clock" class="fs-5 fw-bold text-info"></span>
    </div>
</div>

<div class="container-fluid dashboard-container">
    <div class="row h-100">
        
        <!-- 左側面板：強制更新的氣象圖 -->
        <div class="col-md-3 h-100">
            <div class="monitor-panel">
                <div class="monitor-title"><span>🌀</span> 氣象署颱風路徑</div>
                <img id="img-typhoon" src="https://www.cwa.gov.tw/Data/typhoon/TY_WARN/B20.png" class="cwa-image" alt="颱風路徑">
            </div>
            
            <div class="monitor-panel">
                <div class="monitor-title"><span>📡</span> 雷達回波監測</div>
                <img id="img-radar" src="https://www.cwa.gov.tw/Data/radar/CV1_3600.png" class="cwa-image" alt="雷達回波">
            </div>
            
            <div class="monitor-panel">
                <div class="monitor-title"><span>🌧️</span> 累積雨量圖</div>
                <img id="img-rainfall" src="https://www.cwa.gov.tw/Data/rainfall/QZJ.png" class="cwa-image" alt="雨量圖">
            </div>
        </div>

        <!-- 中央主控面板 -->
        <div class="col-md-9 h-100">
            <div class="main-map-container">
                <div id="tamsui-map"></div>
                
                <!-- 防呆列表：就算地圖不亮燈，這裡也會顯示資料 -->
                <div class="data-list-panel">
                    <h6>即時通報文字紀錄</h6>
                    <div id="text-reports-container">
                        <div class="text-secondary text-center my-3">等待資料同步...</div>
                    </div>
                </div>
            </div>
        </div>
        
    </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>

<script>
    // 1. 右上角時鐘
    function updateClock() {
        document.getElementById('clock').innerText = new Date().toLocaleString('zh-TW', { hour12: false });
    }
    setInterval(updateClock, 1000);
    updateClock();

    // 2. 強制刷新氣象圖 (破解瀏覽器快取)
    function refreshWeatherData() {
        const timestamp = new Date().getTime(); // 取得當下毫秒數
        document.getElementById('img-typhoon').src = `https://www.cwa.gov.tw/Data/typhoon/TY_WARN/B20.png?t=${timestamp}`;
        document.getElementById('img-radar').src = `https://www.cwa.gov.tw/Data/radar/CV1_3600.png?t=${timestamp}`;
        document.getElementById('img-rainfall').src = `https://www.cwa.gov.tw/Data/rainfall/QZJ.png?t=${timestamp}`;
        console.log("氣象圖表已強制更新");
    }
    // 每 5 分鐘自動刷新一次氣象圖
    setInterval(refreshWeatherData, 300000); 

    // 3. 地圖初始化 (暗色系地圖更適合戰情中心)
    const map = L.map('tamsui-map').setView([25.1705, 121.4395], 13);
    L.tileLayer('https://cartodb-basemaps-{s}.global.ssl.fastly.net/dark_all/{z}/{x}/{y}.png', {
        attribution: '&copy; CartoDB', maxZoom: 19
    }).addTo(map);
    const markerLayer = L.layerGroup().addTo(map);

    // 4. 讀取 Google 試算表資料 (網址已為你設定完畢)
    const GOOGLE_SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vS1ok5xvwW-enVzGfgX4C3F63mx7PzTP5_UBmerbb4y13XC65MlqC8V1spvUNK_eiQZ-aEu745sxRKQ/pub?output=csv';

    function fetchDisasterData() {
        if (!GOOGLE_SHEET_CSV_URL || GOOGLE_SHEET_CSV_URL === '') {
            document.getElementById('sync-status').innerText = '未設定 CSV 網址';
            document.getElementById('sync-status').className = 'bg-danger text-white me-3 px-2 py-1 rounded';
            return;
        }

        document.getElementById('sync-status').innerText = '同步中...';
        document.getElementById('sync-status').className = 'bg-warning text-dark me-3 px-2 py-1 rounded';

        Papa.parse(GOOGLE_SHEET_CSV_URL, {
            download: true,
            header: true,
            complete: function(results) {
                const data = results.data;
                console.log("成功抓取試算表資料：", data); 
                processData(data);
                
                document.getElementById('sync-status').innerText = '資料已同步';
                document.getElementById('sync-status').className = 'bg-success text-white me-3 px-2 py-1 rounded';
            },
            error: function() {
                document.getElementById('sync-status').innerText = '連線失敗';
                document.getElementById('sync-status').className = 'bg-danger text-white me-3 px-2 py-1 rounded';
            }
        });
    }

    async function processData(data) {
        markerLayer.clearLayers();
        const listContainer = document.getElementById('text-reports-container');
        listContainer.innerHTML = ''; 

        // 將陣列反轉，讓最新的通報在最上面
        const reversedData = [...data].reverse();

        for (const row of reversedData) {
            // 防呆：如果這一列完全沒資料，就跳過
            if (!row['地點'] && !row['案件類別']) continue;

            // 處理試算表欄位名稱可能不同的問題
            const location = row['地點'] || row['地點 (E)'] || '地點未確認';
            const type = row['案件類別'] || row['案件類別 (C)'] || '一般通報';
            const condition = row['現場狀況與完整歷史進程'] || row['現場狀況與完整歷史進程 (F)'] || row['現場狀況'] || '無詳細說明';
            const time = row['受理時間'] || row['受理時間 (B)'] || '時間未記錄';
            const unit = row['權責單位'] || row['權責單位 (D)'] || '待分派';

            // 1. 寫入右下角的文字列表
            const itemHtml = `
                <div class="report-item">
                    <strong class="text-danger">${type}</strong><br>
                    <small class="text-muted">${time}</small><br>
                    <b>地點：</b>${location}<br>
                    <b>狀況：</b>${condition}<br>
                    <span class="badge bg-primary mt-1">${unit}</span>
                </div>
            `;
            listContainer.innerHTML += itemHtml;

            // 2. 嘗試在地圖上打圖釘
            if (location !== '地點未確認') {
                const fullAddress = location.includes('淡水') ? location : '新北市淡水區' + location;
                try {
                    const response = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(fullAddress)}`);
                    const result = await response.json();
                    
                    if (result && result.length > 0) {
                        L.marker([result[0].lat, result[0].lon]).addTo(markerLayer)
                         .bindPopup(`<b>${type}</b><br>${location}`);
                    }
                } catch (error) {
                    console.error("地址轉換失敗:", fullAddress);
                }
                // 延遲 1 秒避免被圖資伺服器封鎖
                await new Promise(r => setTimeout(r, 1000)); 
            }
        }
        
        if (listContainer.innerHTML === '') {
            listContainer.innerHTML = '<div class="text-secondary text-center my-3">目前無災情通報</div>';
        }
    }

    // 網頁開啟時抓取一次，之後每 30 秒抓一次
    fetchDisasterData();
    setInterval(fetchDisasterData, 30000);

</script>
</body>
</html>
