<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>淡水區災害應變智慧戰情中心</title>
    
    <!-- 引入 Bootstrap CSS (排版) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- 引入 Leaflet CSS (地圖) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        body { background-color: #121212; color: #ffffff; overflow-x: hidden; font-family: "Microsoft JhengHei", sans-serif; }
        .header { background-color: #1f1f1f; padding: 15px 20px; border-bottom: 2px solid #0d6efd; }
        
        /* 版面高度設定 */
        .dashboard-container { height: calc(100vh - 70px); padding: 15px; }
        
        /* 側邊監測面板 */
        .monitor-panel { background-color: #1f1f1f; border-radius: 8px; padding: 10px; height: 31%; margin-bottom: 3%; cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; position: relative; overflow: hidden; }
        .monitor-panel:hover { transform: scale(1.02); box-shadow: 0 0 15px rgba(13, 110, 253, 0.5); border: 1px solid #0d6efd; }
        .monitor-title { font-size: 1rem; font-weight: bold; margin-bottom: 8px; border-left: 4px solid #0d6efd; padding-left: 8px; }
        
        /* 氣象署 iframe/圖片 容器 */
        .cwa-content { width: 100%; height: calc(100% - 30px); border: none; object-fit: cover; }
        
        /* 中央主地圖區 */
        .main-map-container { background-color: #1f1f1f; border-radius: 8px; height: 100%; padding: 10px; position: relative; }
        #tamsui-map { width: 100%; height: calc(100% - 40px); border-radius: 4px; z-index: 1; }
        
        /* 放大顯示用的覆蓋層 (Overlay) */
        #focus-overlay { display: none; position: absolute; top: 10px; left: 10px; right: 10px; bottom: 10px; background-color: rgba(0, 0, 0, 0.9); z-index: 9999; border-radius: 4px; text-align: center; }
        #focus-content { max-width: 100%; max-height: 100%; object-fit: contain; margin-top: 40px; }
        .close-btn { position: absolute; top: 15px; right: 20px; background: #dc3545; color: white; border: none; padding: 8px 20px; border-radius: 4px; font-weight: bold; cursor: pointer; z-index: 10000; }
        .close-btn:hover { background: #c82333; }
        
        /* 地圖彈出視窗(Popup)的文字顏色 */
        .leaflet-popup-content { color: #333; font-size: 14px; }
    </style>
</head>
<body>

<!-- 頂部標題列 -->
<div class="header d-flex justify-content-between align-items-center">
    <h3 class="m-0">🌐 淡水區災害應變智慧戰情中心</h3>
    <div>
        <span id="data-status" class="fs-6 me-3 text-secondary">資料未連線</span>
        <span id="clock" class="fs-5 fw-bold text-info"></span>
    </div>
</div>

<!-- 主要內容區塊 -->
<div class="container-fluid dashboard-container">
    <div class="row h-100">
        
        <!-- 左側面板：氣象署監測 -->
        <div class="col-md-3 h-100">
            <!-- 模組 1：雷達回波 -->
            <div class="monitor-panel" onclick="focusWidget('https://www.cwa.gov.tw/Data/radar/CV1_3600.png')">
                <div class="monitor-title">📡 雷達回波即時監測</div>
                <img src="https://www.cwa.gov.tw/Data/radar/CV1_3600.png" class="cwa-content" alt="雷達回波">
            </div>
            
            <!-- 模組 2：累積雨量 -->
            <div class="monitor-panel" onclick="focusWidget('https://www.cwa.gov.tw/Data/rainfall/QZJ.png')">
                <div class="monitor-title">🌧️ 全台累積雨量圖</div>
                <img src="https://www.cwa.gov.tw/Data/rainfall/QZJ.png" class="cwa-content" alt="雨量圖">
            </div>
            
            <!-- 模組 3：颱風路徑 -->
            <div class="monitor-panel" onclick="focusWidget('https://www.cwa.gov.tw/Data/typhoon/TY_WARN/B20.png')">
                <div class="monitor-title">🌀 颱風路徑潛勢預報</div>
                <img src="https://www.cwa.gov.tw/Data/typhoon/TY_WARN/B20.png" class="cwa-content" alt="颱風路徑">
            </div>
        </div>

        <!-- 中央主控面板：淡水區災害地圖 -->
        <div class="col-md-9 h-100">
            <div class="main-map-container">
                <div class="monitor-title fs-5 mb-2 d-flex justify-content-between">
                    <span>🗺️ 淡水區即時災害地圖</span>
                    <button class="btn btn-sm btn-outline-info" onclick="fetchDisasterData()">手動更新災情</button>
                </div>
                
                <!-- 預設顯示的地圖容器 -->
                <div id="tamsui-map"></div>
                
                <!-- 點擊左側氣象圖後，用來放大顯示的圖層 -->
                <div id="focus-overlay">
                    <button class="close-btn" onclick="closeFocus()">關閉 (返回地圖)</button>
                    <img id="focus-content" src="" alt="放大預覽">
                </div>
            </div>
        </div>
        
    </div>
</div>

<!-- 引入所需 JavaScript 函式庫 -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>

<script>
    /* ==========================================
       1. 基礎設定與介面連動
       ========================================== */
    
    // 右上角時鐘
    function updateClock() {
        const now = new Date();
        document.getElementById('clock').innerText = now.toLocaleString('zh-TW', { hour12: false });
    }
    setInterval(updateClock, 1000);
    updateClock();

    // 氣象圖表點擊放大與關閉
    function focusWidget(sourceUrl) {
        document.getElementById('focus-content').src = sourceUrl;
        document.getElementById('focus-overlay').style.display = 'block';
    }
    function closeFocus() {
        document.getElementById('focus-overlay').style.display = 'none';
        document.getElementById('focus-content').src = '';
    }

    /* ==========================================
       2. 地圖初始化 (聚焦於淡水區)
       ========================================== */
    
    // 預設座標設定在淡水區公所周邊
    const map = L.map('tamsui-map').setView([25.1705, 121.4395], 13);
    
    // 使用 OpenStreetMap 圖層 (可替換為其他暗色系或內政部 TGOS 圖層)
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OSM</a>',
        maxZoom: 19
    }).addTo(map);

    // 建立一個專門用來放災情標記(Marker)的群組
    const markerLayer = L.layerGroup().addTo(map);

    /* ==========================================
       3. 介接 Google 試算表災情資料
       ========================================== */
    
    // ⚠️⚠️⚠️ 關鍵步驟：請將下方網址替換成你 Google 試算表「發布到網路 -> CSV」的網址
    const GOOGLE_SHEET_CSV_URL = '請替換為你的_Google_Sheet_CSV_網址'; 

    function fetchDisasterData() {
        if (GOOGLE_SHEET_CSV_URL === '請替換為你的_Google_Sheet_CSV_網址') {
            console.warn("尚未填寫 Google 試算表網址！");
            return;
        }

        document.getElementById('data-status').innerText = '資料更新中...';
        document.getElementById('data-status').className = 'fs-6 me-3 text-warning';

        Papa.parse(GOOGLE_SHEET_CSV_URL, {
            download: true,
            header: true,
            complete: function(results) {
                const data = results.data;
                plotMarkersOnMap(data);
                
                document.getElementById('data-status').innerText = '資料已同步';
                document.getElementById('data-status').className = 'fs-6 me-3 text-success';
            },
            error: function(error) {
                document.getElementById('data-status').innerText = '連線失敗';
                document.getElementById('data-status').className = 'fs-6 me-3 text-danger';
            }
        });
    }

    // 將資料轉換為地圖上的圖釘
    async function plotMarkersOnMap(data) {
        // 清空舊的標記，避免重複繪製
        markerLayer.clearLayers();

        for (const row of data) {
            // 略過沒有地點或地點空白的無效資料
            if (!row['地點'] || row['地點'].trim() === '') continue;

            // 組合完整地址，提升轉換座標的成功率
            const fullAddress = row['地點'].includes('淡水') ? row['地點'] : '新北市淡水區' + row['地點'];

            // 呼叫免費開源的 Nominatim 服務將地址轉為座標 (Geocoding)
            // 備註：實務上若地址寫「學府路10號前」這種不標準格式，轉換可能會失敗。
            try {
                const response = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(fullAddress)}`);
                const result = await response.json();
                
                if (result && result.length > 0) {
                    const lat = result[0].lat;
                    const lon = result[0].lon;

                    // 設計點擊圖釘後彈出的災情資訊卡
                    const popupContent = `
                        <div style="min-width: 200px;">
                            <h6 style="color: #dc3545; font-weight: bold; border-bottom: 1px solid #ccc; padding-bottom: 5px;">
                                ⚠️ ${row['案件類別'] || '災情通報'}
                            </h6>
                            <b>受理時間：</b>${row['受理時間'] || '未紀錄'}<br>
                            <b>通報里別：</b>${row['通報里別'] || '待確認'}<br>
                            <b>地點：</b>${row['地點']}<br>
                            <b>現場狀況：</b>${row['現場狀況'] || '無詳細說明'}<br>
                            <b>權責單位：</b><span style="color: #0d6efd; font-weight: bold;">${row['權責單位'] || '待分派'}</span><br>
                            <b>目前狀態：</b>${row['狀態'] || '處理中'}
                        </div>
                    `;

                    // 將圖釘加到地圖上
                    L.marker([lat, lon]).addTo(markerLayer).bindPopup(popupContent);
                }
            } catch (error) {
                console.error(`地址轉換座標失敗: ${fullAddress}`);
            }

            // 加入延遲，避免連續請求被開源伺服器阻擋 (Rate Limiting)
            await new Promise(resolve => setTimeout(resolve, 1000));
        }
    }

    // 網頁開啟時自動抓取一次資料
    fetchDisasterData();
    
    // 設定每 60 秒自動背景同步一次資料庫
    setInterval(fetchDisasterData, 60000);

</script>

</body>
</html>
