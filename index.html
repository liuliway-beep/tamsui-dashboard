<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>淡水區災害應變智慧戰情中心</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; font-family: Arial, sans-serif; background: #1a1a1a; color: #fff; }
        header { background: #b71c1c; padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; }
        .ticker { background: #ff9800; color: #000; padding: 8px; font-weight: bold; white-space: nowrap; overflow: hidden; box-sizing: border-box; }
        .ticker span { display: inline-block; padding-left: 100%; animation: ticker 25s linear infinite; }
        @keyframes ticker { 0% { transform: translate(0, 0); } 100% { transform: translate(-100%, 0); } }
        .main-container { display: flex; height: calc(100vh - 95px); }
        #map { flex: 2; height: 100%; }
        .side-panel { flex: 1; background: #262626; padding: 15px; overflow-y: auto; border-left: 2px solid #444; }
        .panel-box { background: #333; padding: 10px; margin-bottom: 15px; border-radius: 5px; }
        .panel-box h3 { margin-top: 0; color: #ff5252; border-bottom: 1px solid #555; padding-bottom: 5px; }
        img.radar-preview { width: 100%; border-radius: 4px; }
        .alert-badge { background: #d32f2f; color: white; padding: 5px 10px; border-radius: 3px; display: inline-block; font-weight: bold; }
    </style>
</head>
<body>

    <header>
        <h2>新北市淡水區災害應變智慧戰情中心</h2>
        <div id="system-time">系統時間：載入中...</div>
    </header>

    <!-- 災防公告跑馬燈 (對應 Newses 資料)[cite: 9] -->
    <div class="ticker">
        <span id="ticker-text">正在載入最新災防與交通管制公告...</span>
    </div>

    <div class="main-container">
        <!-- Leaflet 地圖主畫面 -->
        <div id="map"></div>

        <!-- 右側監控面板 -->
        <div class="side-panel">
            <!-- 氣象與雷達回波區 (對應 O-A0058-004)[cite: 11] -->
            <div class="panel-box">
                <h3>即時雷達整合回波圖</h3>
                <img id="cwa-radar" class="radar-preview" src="https://cwaopendata.s3.ap-northeast-1.amazonaws.com/Observation/O-A0058-004.png" alt="雷達回波圖載入中">
                <p style="font-size: 12px; color: #aaa; margin: 5px 0 0 0;">資料來源：中央氣象署 (每10分鐘自動更新)</p>
            </div>

            <!-- 氣象特報與警戒區 (對應 W-C0033-001)[cite: 13, 14] -->
            <div class="panel-box">
                <h3>氣象特報與災害警戒</h3>
                <div id="weather-hazard-status">
                    <span class="alert-badge">正常監控中</span>
                    <p id="hazard-desc" style="margin: 8px 0 0 0; font-size: 14px;">背景持續輪詢中央氣象署豪雨及強風特報[cite: 13, 14]。</p>
                </div>
            </div>

            <!-- 即時事件與搶修區 (對應 LiveEvents)[cite: 7, 8] -->
            <div class="panel-box">
                <h3>淡水區即時工程與搶修案件</h3>
                <ul id="tamsui-events-list" style="padding-left: 20px; font-size: 13px; margin: 0;">
                    <li>正在同步淡水在地管線與道路事件[cite: 7, 8]...</li>
                </ul>
            </div>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // 1. 初始化 Leaflet 地圖 (以淡水區公所為中心)
        const map = L.map('map').setView([25.1748, 121.4431], 14);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap'
        }).addTo(map);

        // 更新系統時間
        setInterval(() => {
            document.getElementById('system-time').innerText = "系統時間：" + new Date().toLocaleString();
        }, 1000);

        // 2. 雷達回波圖自動重新整理 (每 10 分鐘)[cite: 11]
        setInterval(() => {
            const radarImg = document.getElementById('cwa-radar');
            radarImg.src = "https://cwaopendata.s3.ap-northeast-1.amazonaws.com/Observation/O-A0058-004.png?t=" + new Date().getTime();
        }, 600000);

        // 3. 背景自動載入與過濾資料 (範例結構)
        async function initWarRoomData() {
            try {
                // A. 模擬載入氣象特報 (對應 W-C0033-001)[cite: 13, 14]
                // 實務上請將網址替換為您申請啟用的 CWA API 連結
                document.getElementById('hazard-desc').innerText = "新北市與北海岸地區目前維持豪雨與陸上強風特報監控[cite: 13, 14]。";

                // B. 載入 TDX CCTV 並篩選淡水區點位 (對應 CCTV 資料)[cite: 3, 4]
                // 此處帶入範例中已知的淡水民權路口與中正東路等點位座標進行標註
                const tamsuiCCTVs = [
                    { desc: "淡水民權路187巷", lat: 25.13207, lon: 121.45852, url: "https://192.168.1.91/web/cctv/liveview.html" },
                    { desc: "淡水區中正東路一段3巷口", lat: 25.16480, lon: 121.45050, url: "https://atis.ntpc.gov.tw/ATIS/ShowFrame4CCTV/C000174" },
                    { desc: "淡水區新民隧道-南下隧道內", lat: 25.18617, lon: 121.42781, url: "https://atis.ntpc.gov.tw/ATIS/ShowFrame4CCTV/C000402" }
                ];

                tamsuiCCTVs.forEach(cctv => {
                    L.marker([cctv.lat, cctv.lon]).addTo(map)
                        .bindPopup(`<b>[CCTV] ${cctv.desc}</b><br><a href="${cctv.url}" target="_blank">點擊開啟即時影像</a>`);
                });

                // C. 模擬載入淡水區即時工程事件 (對應 LiveEvents 中的水管搶修)[cite: 7, 8]
                const eventList = document.getElementById('tamsui-events-list');
                eventList.innerHTML = `
                    <li><b>[自來水搶修]</b> 淡水區新生街17號 (管線維修)[cite: 7, 8]</li>
                    <li><b>[管線工程]</b> 淡水區水源街一段53巷 (漏水搶修)[cite: 7, 8]</li>
                `;

                // D. 模擬跑馬燈公告 (對應 Newses)[cite: 9]
                document.getElementById('ticker-text').innerText = "【即時防災公告】白海豚颱風逼近，淡江大橋將實施人行道及機車道管制，請用路人注意安全[cite: 9]。";

            } catch (error) {
                console.error("戰情中心初始化資料失敗：", error);
            }
        }

        // 頁面載入完成後執行初始化
        window.onload = initWarRoomData;
    </script>
</body>
</html>
