<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>淡水區災害應變智慧戰情中心</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root {
            --primary-color: #1b365d;
            --accent-color: #d9534f;
            --bg-color: #f4f6f9;
            --text-color: #333;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: "Microsoft JhengHei", Arial, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); display: flex; flex-direction: column; height: 100vh; }
        header { background-color: var(--primary-color); color: white; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        header h1 { font-size: 1.25rem; font-weight: bold; display: flex; align-items: center; gap: 10px; }
        .status-badge { background-color: #28a745; color: white; padding: 4px 10px; border-radius: 12px; font-size: 0.8rem; }
        .main-container { display: flex; flex: 1; overflow: hidden; }
        #map { flex: 2; height: 100%; }
        .sidebar { flex: 1; background: white; border-left: 1px solid #ddd; display: flex; flex-direction: column; padding: 15px; overflow-y: auto; max-width: 450px; }
        .sidebar h2 { font-size: 1.1rem; margin-bottom: 10px; color: var(--primary-color); border-bottom: 2px solid var(--primary-color); padding-bottom: 5px; }
        .data-table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 0.9rem; }
        .data-table th, .data-table td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        .data-table th { background-color: #f8f9fa; color: var(--primary-color); }
        .refresh-info { font-size: 0.8rem; color: #666; margin-top: 10px; text-align: right; }
    </style>
</head>
<body>

    <header>
        <h1>
            <span>🛡️</span> 淡水區災害應變智慧戰情中心
        </h1>
        <div class="status-badge" id="systemStatus">系統連線中...</div>
    </header>

    <div class="main-container">
        <div id="map"></div>
        <div class="sidebar">
            <h2>即時災情與管制大表</h2>
            <div id="tableContainer">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>案件編號</th>
                            <th>災情類型</th>
                            <th>地點</th>
                            <th>狀態</th>
                        </tr>
                    </thead>
                    <tbody id="dataTableBody">
                        <tr><td colspan="4" style="text-align: center;">載入資料中...</td></tr>
                    </tbody>
                </table>
            </div>
            <div class="refresh-info" id="refreshTime">最後更新：尚未同步</div>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // 設定 Google Apps Script 部署網址
        const API_URL = 'https://script.google.com/macros/s/AKfycbzNUDQHsFxsrunuYkXoKqeBAgEBROKaFnKbob9IHWdXIPkJva2dPM45JGYVAM6oxZw9/exec';

        let map;
        let markersLayer = L.layerGroup();
        let globalData = [];

        function initMap() {
            // 初始化地圖中心點設在淡水區
            map = L.map('map').setView([25.1720, 121.4450], 13);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                attribution: '© OpenStreetMap'
            }).addTo(map);
            markersLayer.addTo(map);
        }

        // 從 Google Apps Script 讀取即時資料
        async function loadRealtimeData() {
            try {
                const response = await fetch(API_URL);
                const result = await response.json();
                
                if (result && result.data) {
                    globalData = result.data;
                    renderTable(globalData);
                    renderMarkers(globalData);
                    
                    document.getElementById('systemStatus').textContent = '即時同步中';
                    document.getElementById('systemStatus.style.backgroundColor') = '#28a745';
                    
                    const now = new Date();
                    document.getElementById('refreshTime').textContent = `最後更新：${now.toLocaleTimeString()}`;
                }
            } catch (error) {
                console.error('讀取資料失敗:', error);
                document.getElementById('systemStatus').textContent = '連線異常';
                document.getElementById('systemStatus').style.backgroundColor = '#d9534f';
            }
        }

        function renderTable(data) {
            const tbody = document.getElementById('dataTableBody');
            tbody.innerHTML = '';
            
            if (data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" style="text-align: center;">目前無災情資料</td></tr>';
                return;
            }

            data.forEach(item => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${item.id || ''}</td>
                    <td>${item.type || ''}</td>
                    <td>${item.location || ''}</td>
                    <td>${item.status || ''}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        function renderMarkers(data) {
            markersLayer.clearLayers();
            data.forEach(item => {
                if (item.lat && item.lng) {
                    const marker = L.marker([item.lat, item.lng]);
                    marker.bindPopup(`<b>${item.type}</b><br>${item.location}<br>狀態：${item.status}`);
                    markersLayer.addLayer(marker);
                }
            });
        }

        window.onload = () => {
            initMap();
            loadRealtimeData(); // 立即讀取一次
            // 每 30 秒自動向 Google 試算表同步一次最新資料
            setInterval(loadRealtimeData, 30000);
        };
    </script>
</body>
</html>
